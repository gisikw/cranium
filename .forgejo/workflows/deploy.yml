name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Attic
        run: |
          mkdir -p ~/.config/attic
          printf '%s\n' \
            'default-server = "forge"' \
            '' \
            '[servers.forge]' \
            "endpoint = \"$ATTIC_CACHE_URL\"" \
            "token = \"$(cat $ATTIC_TOKEN_FILE)\"" \
            > ~/.config/attic/config.toml

      - name: Debug flake eval
        run: |
          echo "--- flake show ---"
          nix flake show 'path:.' --all-systems 2>&1 || true
          echo "--- try eval packages ---"
          nix eval 'path:.#packages.x86_64-linux.default.name' --show-trace 2>&1 || true
          echo "--- try nix-instantiate ---"
          nix-instantiate --eval --strict --show-trace -E '
            let flake = builtins.getFlake "path:'$(pwd)'";
            in builtins.attrNames flake.packages.x86_64-linux
          ' 2>&1 || true

      - name: Build
        run: nix build 'path:.#default' -L --show-trace

      - name: Test
        run: nix develop 'path:.' -c just test

      - name: Push to Attic
        run: attic push fort ./result

      - name: Register Overlay
        run: |
          STORE_PATH=$(readlink -f ./result)
          curl -sf -X POST https://overlay-registry.gisi.network/dev/cranium-v2 \
            -d "{\"storePath\":\"$STORE_PATH\"}"

      - name: Trigger Refresh
        run: |
          fort ratched refresh '{"overlay": "cranium-v2"}'
