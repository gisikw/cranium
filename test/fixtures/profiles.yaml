default: test

profiles:
  test:
    backend: mock
    model: test-model

  test-ollama:
    backend: ollama
    model: test-ollama-model

  test-cc:
    backend: claudecode
    model: claude-opus-4-6

  test-with-identity:
    backend: anthropic
    model: test-model
    identity: test/fixtures/test-identity.txt

  test-prepend:
    backend: mock
    model: test-model
    identity: test/fixtures/test-identity.txt
    openai_system_mode: prepend

  test-append:
    backend: mock
    model: test-model
    identity: test/fixtures/test-identity.txt
    openai_system_mode: append

  test-with-plugins:
    backend: mock
    model: test-model
    plugins:
      - module: Cranium.TestPlugins.Echo
      - module: Cranium.TestPlugins.Skipper
        config:
          threshold: 3

ollama_url: http://localhost:11434
