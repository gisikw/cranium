default: test

profiles:
  test:
    backend: mock
    model: test-model

  test-ollama:
    backend: ollama
    model: test-ollama-model

  test-cc:
    backend: claudecode
    model: claude-opus-4-6

  test-with-identity:
    backend: anthropic
    model: test-model
    identity: test/fixtures/test-identity.txt

  test-prepend:
    backend: mock
    model: test-model
    identity: test/fixtures/test-identity.txt
    openai_system_mode: prepend

  test-append:
    backend: mock
    model: test-model
    identity: test/fixtures/test-identity.txt
    openai_system_mode: append

  test-with-plugins:
    backend: mock
    model: test-model
    plugins:
      - module: Cranium.TestPlugins.Echo
      - module: Cranium.TestPlugins.Skipper
        config:
          threshold: 3

  test-permissive:
    backend: mock
    model: test-model
    tool_posture: permissive

  test-sandbox-grants:
    backend: mock
    model: test-model
    tool_rw:
      - /home/dev/Projects/hoard
    tool_ro:
      - /var/log

  test-thinking:
    backend: mock
    model: test-model
    thinking: false
    backend_config:
      thinking_mode: prefill
      endpoint: http://localhost:9999/v1

  test-tiamat:
    backend: tiamat
    router_profile: exo
    identity: test/fixtures/test-identity.txt
    backend_config:
      endpoint: http://localhost:4002
      timeout: 300000

  test-audio:
    backend: mock
    model: test-model
    voice: af_heart
    speed: 0.9
    response_format: wav
    tts_url: http://localhost:8800/v1/audio/speech
    stt_url: http://localhost:8801/v1/audio/transcriptions
    stt_language: en

  test-identity-list:
    backend: mock
    model: test-model
    identity:
      - test/fixtures/test-identity.txt
      - test/fixtures/test-identity-2.txt

  test-tools-prompt:
    backend: mock
    model: test-model
    identity: test/fixtures/test-identity.txt
    tools_prompt: true

ollama_url: http://localhost:11434

room_defaults:
  personal-chat: test-with-identity
  cranium: test-cc
