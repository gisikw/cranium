project:
  prefix: cv2

pipeline:
  from: ~/Projects/hoard/pipelines/coding
  workflows:
    main:
      - name: classify
        type: decision
        prompt: classify.md
        model: claude-haiku-4-5-20251001
        routes: [task, research, bug]

    task:
      - name: plan
        type: action
        prompt: plan.md
      - name: actionable
        type: decision
        prompt: actionable.md
        model: claude-haiku-4-5-20251001
      - name: implement
        type: action
        prompt: implement.md
      - name: verify
        type: action
        run: mix test --no-start && mix compile --warnings-as-errors
      - name: review
        type: decision
        prompt: review.md
        note_artifact: summary.md

    research:
      - name: investigate
        type: action
        prompt: investigate.md
        note_artifact: findings.md

    bug:
      - name: diagnose
        type: action
        prompt: diagnose.md
        note_artifact: diagnosis.md
      - name: assess
        type: decision
        prompt: assess.md
        model: claude-haiku-4-5-20251001
        routes: [task]
